[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dgms-rag-agent"
version = "0.1.0"
description = "AI retrieves data and answers questions based on DGMS guidelines"
requires-python = ">=3.13"
dependencies = [
		"python-dotenv >= 1.2,<2",
		"pydantic>=2.0,<3",
		"fastapi",
		"uvicorn"
		]

[project.optional-dependencies]
dev = [
	"pytest>=8,<9",
	"httpx>=0.27,<1"
]
